<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clustering results</title>
  <style>
    body {
      color: #1f2933;
      font-family: Arial, sans-serif;
      line-height: 1.4;
      margin: 24px;
    }
    table {
      border-collapse: collapse;
      margin-top: 18px;
      min-width: 420px;
    }
    .table-scroll {
      overflow-x: auto;
    }
    .empty-table {
      color: #52606d;
      font-style: italic;
    }
    th, td {
      border-bottom: 1px solid #d9e2ec;
      padding: 8px 12px;
      text-align: left;
    }
    th {
      background: #f0f4f8;
    }
    .preview {
      border: 1px solid #d9e2ec;
      max-width: min(100%, 1200px);
    }
    .umap-preview {
      max-width: min(100%, 680px);
    }
    .grid {
      display: grid;
      gap: 14px;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
    .sample {
      border: 1px solid #d9e2ec;
      border-radius: 6px;
      padding: 8px;
    }
    .sample img {
      display: block;
      height: 140px;
      object-fit: contain;
      width: 100%;
    }
    .meta {
      font-size: 12px;
      margin-top: 8px;
    }
    .path {
      color: #52606d;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>

<h1>Clustering results</h1>
<p><a href="manifest.csv">manifest.csv</a> | <a href="cluster_metrics.csv">cluster_metrics.csv</a></p>
<figure>
  <a href="umap_clusters.png">
    <img class="preview umap-preview" src="umap_clusters.png" alt="Clusters on UMAP 2D">
  </a>
  <figcaption>Best consensus clustering su UMAP 2D</figcaption>
</figure>
<figure>
  <a href="samples_per_cluster.png">
    <img class="preview" src="samples_per_cluster.png" alt="Samples per cluster">
  </a>
  <figcaption>Samples per cluster</figcaption>
</figure>
<h2>Cluster data</h2>

<div class="table-scroll">
  <table>
    <thead><tr><th>cluster</th><th>size</th><th>dbcv</th><th>cosine_similarity</th></tr></thead>
    <tbody><tr><td><a href="cluster_0.html">0</a></td><td>244</td><td>0.4208</td><td>0.2209</td></tr>
<tr><td><a href="cluster_1.html">1</a></td><td>339</td><td>0.7942</td><td>0.1052</td></tr>
<tr><td><a href="cluster_2.html">2</a></td><td>59</td><td>0.7314</td><td>0.2896</td></tr></tbody>
  </table>
</div>


</body>
</html>
